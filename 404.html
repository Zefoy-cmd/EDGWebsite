    <meta name="description" content="Siden du leder efter findes ikke. Gå tilbage til forsiden af ErDuGamer." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#05080f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#indhold">Spring til indhold</a>

    <header class="topbar">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="ErDuGamer – forside">
          <img class="brand-mark" src="/favicon.svg" alt="" width="32" height="32" />
          ErDuGamer
        </a>
        <button class="nav-toggle" type="button" aria-label="Åbn menu" aria-expanded="false" aria-controls="main-nav">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav" id="main-nav" aria-label="Hovedmenu">
          <a href="/#om">Om os</a>
          <a href="/#events">Events</a>
          <a href="/#faq">FAQ</a>
          <a href="/#kontakt">Kontakt</a>

        </nav>
      </div>

    <main id="indhold">
      <section class="container error-page">
        <div>
          <p class="error-code" aria-hidden="true">404</p>
          <h1>Game over – siden findes ikke</h1>
          <p>Siden er måske flyttet, slettet, eller også er der en tastefejl i adressen. Prøv at respawne på forsiden.</p>
          <div class="hero-actions" data-hero-cta>
            <a class="button button-primary" href="/">Tilbage til forsiden</a>
            <a class="button button-secondary" href="/#om">Læs om ErDuGamer</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span>© <span data-year>2026</span> ErDuGamer</span>
        <div class="footer-links">
          <a href="/privatlivspolitik">Privatlivspolitik</a>
          <a href="/vilkaar">Vilkår</a>
          <button type="button" data-cookie-settings>Cookieindstillinger</button>
        </div>
      </div>
    </footer>

    <script src="/script.js" defer></script>

</html>
